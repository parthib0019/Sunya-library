<!DOCTYPE html>
<html lang="{{ g.user.locale if g.user and g.user.locale else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#202124">
  <title>{{ title }} | {{ _('Sunya Library') }}</title>

  <link rel="apple-touch-icon" sizes="140x140" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

  <!-- PDF Reader Stylesheet (Google Play Books Style) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reading/pdf_reader.css') }}">

  <!-- PDF.js Core Library -->
  <script src="{{ url_for('static', filename='js/libs/pdf.js') }}" type="module"></script>

  <!-- Server Configuration -->
  <script type="text/javascript">
    window.calibre = {
      bookId: {{ pdffile | tojson }},
      bookTitle: {{ title | tojson }},
      bookDetailUrl: "{{ url_for('web.show_book', book_id=pdffile) }}",
      bookUrl: "{{ url_for('web.serve_book', book_id=pdffile, book_format='pdf') }}",
      bookmarkUrl: "{{ url_for('web.set_bookmark', book_id=pdffile, book_format='PDF') }}",
      bookmark: "{{ bookmark.bookmark_key if bookmark != None else '' }}",
      useBookmarks: {{ current_user.is_authenticated | tojson }},
      workerUrl: "{{ url_for('static', filename='js/libs/pdf.worker.js') }}",
      cMapUrl: "{{ url_for('static', filename='cmaps/') }}"
    };
  </script>

  <!-- PDF Reader Controller -->
  <script src="{{ url_for('static', filename='js/reading/pdf_reader.js') }}" defer></script>
</head>

<body>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div id="readerApp">
    <!-- Floating Top Bar -->
    <header class="top-bar" id="topBar">
      <div class="bar-left">
        <button class="btn-icon" id="backBtn" title="{{ _('Back to Book Details') }}" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
      </div>

      <div class="bar-center">
        <div class="book-title" id="bookTitleDisplay">{{ title }}</div>
        <div class="book-author">
          {% if entry and entry.ordered_authors %}
            {% for author in entry.ordered_authors %}
              {{ author.name.replace('|', ',') }}{% if not loop.last %}, {% endif %}
            {% endfor %}
          {% endif %}
        </div>
      </div>

      <div class="bar-right">
        <!-- Table of Contents Toggle -->
        <button class="btn-icon" id="tocBtn" title="{{ _('Table of Contents') }}" aria-label="Table of Contents">
          <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        </button>

        <!-- Highlights & Notes Drawer Toggle -->
        <button class="btn-icon" id="highlightsBtn" title="{{ _('Highlights & Notes') }}" aria-label="Highlights">
          <svg viewBox="0 0 24 24"><path d="M15.24 3.37l-2.12-2.12a1.5 1.5 0 0 0-2.12 0L2 10.29V14h3.71l8.95-8.95a1.5 1.5 0 0 0 0-2.12l.58.44zm-9.95 9.13H3.5v-1.79l7.5-7.5 1.79 1.79-7.5 7.5zM20 17H4v2h16v-2z"/></svg>
          <span class="badge" id="highlightsBadge">0</span>
        </button>

        <!-- Theme Toggle -->
        <button class="btn-icon" id="themeBtn" title="{{ _('Switch Theme (Light, Sepia, Dark)') }}" aria-label="Theme">
          <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06z"/></svg>
        </button>

        <!-- Zoom Controls -->
        <button class="btn-icon" id="zoomOutBtn" title="{{ _('Zoom Out') }}" aria-label="Zoom Out">
          <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <button class="btn-icon" id="zoomFitBtn" title="{{ _('Fit Page / Fit Width') }}" aria-label="Fit View">
          <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
        </button>
        <button class="btn-icon" id="zoomInBtn" title="{{ _('Zoom In') }}" aria-label="Zoom In">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>

        <!-- Fullscreen -->
        <button class="btn-icon" id="fullscreenBtn" title="{{ _('Toggle Fullscreen') }}" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </header>

    <!-- Reading Viewport Stage -->
    <main id="readerViewport">
      <!-- Left & Right Margin Tap / Click Navigation Zones -->
      <div class="margin-nav-zone margin-prev" id="navPrevZone" title="{{ _('Previous Page') }}">
        <div class="nav-chevron">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>
      </div>

      <!-- Single Page Canvas Container -->
      <div id="pageContainer">
        <canvas id="pageCanvas"></canvas>
        <div id="textLayer" class="textLayer"></div>
        <div id="highlightsLayer" class="highlights-layer"></div>
      </div>

      <div class="margin-nav-zone margin-next" id="navNextZone" title="{{ _('Next Page') }}">
        <div class="nav-chevron">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
      </div>
    </main>

    <!-- Floating Bottom Bar (Page Navigation & Scrubber) -->
    <footer class="bottom-bar" id="bottomBar">
      <div class="nav-cluster">
        <button class="btn-icon" id="prevPageBtn" title="{{ _('Previous Page') }}" aria-label="Previous Page">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
      </div>

      <!-- Google Play Books Style Scrubber Slider -->
      <div class="slider-container">
        <div class="slider-tooltip" id="sliderTooltip">Page 1</div>
        <input type="range" min="1" max="1" value="1" class="page-slider" id="pageSlider" aria-label="Page Scrubber">
      </div>

      <div class="nav-cluster">
        <button class="btn-icon" id="nextPageBtn" title="{{ _('Next Page') }}" aria-label="Next Page">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <div class="page-info-display">
          <input type="number" min="1" max="1" value="1" class="page-input" id="pageInput" aria-label="Current Page">
          <span>/</span>
          <span id="totalPages">1</span>
          <span class="pct" id="pagePercent">(1%)</span>
        </div>
      </div>
    </footer>

    <!-- Floating Highlighter Palette (Google Play Books Style) -->
    <div id="highlighterMenu">
      <button class="hl-color-dot color-yellow" data-color="yellow" title="{{ _('Yellow') }}"></button>
      <button class="hl-color-dot color-green"  data-color="green"  title="{{ _('Green') }}"></button>
      <button class="hl-color-dot color-blue"   data-color="blue"   title="{{ _('Blue') }}"></button>
      <button class="hl-color-dot color-pink"   data-color="pink"   title="{{ _('Pink') }}"></button>
      <button class="hl-color-dot color-orange" data-color="orange" title="{{ _('Orange') }}"></button>
      <div class="menu-divider"></div>
      <button class="btn-menu-action" id="btnCopyText" title="{{ _('Copy text') }}">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
      <button class="btn-menu-action" id="btnCloseMenu" title="{{ _('Dismiss') }}">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <!-- Highlight Edit Popover -->
    <div id="highlightEditPopover">
      <div class="popover-header">
        <div class="popover-colors">
          <button class="hl-color-dot color-yellow" data-color="yellow"></button>
          <button class="hl-color-dot color-green"  data-color="green"></button>
          <button class="hl-color-dot color-blue"   data-color="blue"></button>
          <button class="hl-color-dot color-pink"   data-color="pink"></button>
          <button class="hl-color-dot color-orange" data-color="orange"></button>
        </div>
        <div class="popover-actions">
          <button class="btn-menu-action" id="btnCopyHlText" title="{{ _('Copy text') }}">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
          <button class="btn-menu-action" id="btnDeleteHl" title="{{ _('Delete highlight') }}">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
          <button class="btn-menu-action" id="btnClosePopover" title="{{ _('Close') }}">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <textarea class="popover-note-area" id="popoverNoteArea" placeholder="{{ _('Add a note...') }}"></textarea>
      <button id="btnSaveNote" style="align-self:flex-end; padding:4px 10px; font-size:12px; font-weight:600; background:var(--accent); color:#fff; border:none; border-radius:4px; cursor:pointer;">{{ _('Save') }}</button>
    </div>

    <!-- Side Drawer Backdrop -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- Table of Contents Drawer -->
    <aside class="side-drawer" id="tocDrawer">
      <div class="drawer-header">
        <span class="drawer-title">{{ _('Table of Contents') }}</span>
        <button class="btn-icon" id="closeTocBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="drawer-content">
        <ul class="toc-list" id="tocList"></ul>
      </div>
    </aside>

    <!-- Highlights & Notes Drawer -->
    <aside class="side-drawer drawer-right" id="highlightsDrawer">
      <div class="drawer-header">
        <span class="drawer-title">{{ _('Highlights & Notes') }}</span>
        <button class="btn-icon" id="closeHighlightsBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="drawer-content" id="highlightsList"></div>
    </aside>

    <!-- Fast Loading Spinner Overlay -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">{{ _('Opening book…') }}</div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>
  </div>
</body>
</html>
